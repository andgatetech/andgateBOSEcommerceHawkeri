name: Hawkeri CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hawkeri-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public runtime endpoint required while Next prerenders sitemap/catalog routes.
      NEXT_PUBLIC_API_URL: https://api.andgatebos.com/api/ecommerce
      NEXT_PUBLIC_IMAGE_BASE_URL: https://api.andgatebos.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
