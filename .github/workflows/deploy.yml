name: Deploy committed VPS release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hawkeri-current-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy exact GitHub revision
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 185.198.27.14
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 85m
          script: |
            set -eu
            bash /var/www/hawkeri-current/scripts/deploy-vps.sh '${{ github.sha }}'
