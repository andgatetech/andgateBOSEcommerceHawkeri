name: Deploy committed VPS release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Hawkeri CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hawkeri-current-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy exact GitHub revision
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 185.198.27.14
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 85m
          script: |
            set -eu
            bash /var/www/hawkeri-current/scripts/deploy-vps.sh '${{ github.event.workflow_run.head_sha || github.sha }}'
